name: Test 🧪 Plush

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Install uv
      uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        uv sync
    - name: Running pylint python/plush
      run: |
        uv run pylint python/plush
    - name: Running pylint fabfile.py
      run: |
        uv run pylint fabfile.py
    - name: Running fab -l
      run: |
        uv run fab -l
    - name: Running auth --help
      run: |
        uv run auth --help
